  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B1E"/>
      <stop offset="0.6" stop-color="#0C1233"/>
      <stop offset="1" stop-color="#141C4A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pacbody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="1" stop-color="#FFB02E"/>
    </linearGradient>
    <filter id="gblur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7FE3FF" stop-opacity="0"/><stop offset="0.5" stop-color="#7FE3FF" stop-opacity="0.10"/><stop offset="1" stop-color="#7FE3FF" stop-opacity="0"/></linearGradient>`r`n    <filter id="pglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <style>
      .dot { fill:#FFE9A8; animation:10.0s linear infinite; animation-delay:0s; }
      .pac-run { animation: run 10.0s linear infinite; }
      .ghost { animation: run 10.0s linear infinite; animation-delay: var(--d); }
      .ghost .eye-glow { animation: none; }
      .bob { animation: bob 1.1s ease-in-out infinite alternate; }
      .scan { animation: scan 5s linear infinite; }
      .hud { font-family:"SF Mono","Cascadia Code",Consolas,monospace; font-size:13px;
              letter-spacing:2.5px; fill:#9FB6FF; }
      .jp { font-family:"Yu Gothic","Meiryo","Microsoft YaHei",sans-serif; font-size:12px;
             letter-spacing:4px; fill:#7FE3FF; opacity:.55; }
      @keyframes run { from { transform: translateX(0) } to { transform: translateX(880px) } }
      @keyframes bob { from { transform: translateY(-2px) } to { transform: translateY(2px) } }
      @keyframes scan { from { transform: translateY(0) } to { transform: translateY(230px) } }
      @keyframes dot0 { 0%,0.74% {opacity:1} 1.74%,100% {opacity:0} }@keyframes dot1 { 0%,5.52% {opacity:1} 6.52%,100% {opacity:0} }@keyframes dot2 { 0%,10.31% {opacity:1} 11.31%,100% {opacity:0} }@keyframes dot3 { 0%,15.09% {opacity:1} 16.09%,100% {opacity:0} }@keyframes dot4 { 0%,19.88% {opacity:1} 20.88%,100% {opacity:0} }@keyframes dot5 { 0%,24.66% {opacity:1} 25.66%,100% {opacity:0} }@keyframes dot6 { 0%,29.44% {opacity:1} 30.44%,100% {opacity:0} }@keyframes dot7 { 0%,34.23% {opacity:1} 35.23%,100% {opacity:0} }@keyframes dot8 { 0%,39.01% {opacity:1} 40.01%,100% {opacity:0} }@keyframes dot9 { 0%,43.80% {opacity:1} 44.80%,100% {opacity:0} }@keyframes dot10 { 0%,48.58% {opacity:1} 49.58%,100% {opacity:0} }@keyframes dot11 { 0%,53.37% {opacity:1} 54.37%,100% {opacity:0} }@keyframes dot12 { 0%,58.15% {opacity:1} 59.15%,100% {opacity:0} }@keyframes dot13 { 0%,62.94% {opacity:1} 63.94%,100% {opacity:0} }@keyframes dot14 { 0%,67.72% {opacity:1} 68.72%,100% {opacity:0} }@keyframes dot15 { 0%,72.51% {opacity:1} 73.51%,100% {opacity:0} }@keyframes dot16 { 0%,77.29% {opacity:1} 78.29%,100% {opacity:0} }@keyframes dot17 { 0%,82.08% {opacity:1} 83.08%,100% {opacity:0} }@keyframes dot18 { 0%,86.86% {opacity:1} 87.86%,100% {opacity:0} }@keyframes dot19 { 0%,91.65% {opacity:1} 92.65%,100% {opacity:0} }
